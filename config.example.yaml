# Route-order calculator configuration.

planner:
  # Used when a CLI/API request does not specify top_k.
  default_top_k: 5
  # Protects the synchronous API response size.
  max_top_k: 20
  # Brute-force runtime is (n-1)!; keep this conservative.
  max_stops: 10

providers:
  nominatim_base_url: "https://nominatim.openstreetmap.org"
  # Public demo endpoint; the app spaces its cache misses to at most one/second.
  osrm_base_url: "https://router.project-osrm.org"

cache:
  # Cache successful geocodes and complete OSRM matrices under separate keys.
  enabled: true
  directory: "data/cache"
  # Fixed addresses rarely move; retain successful resolutions for 90 days.
  geocode_ttl_hours: 2160
  # Fixed delivery sites change rarely; keep baseline matrices for 30 days.
  matrix_ttl_hours: 720

http:
  geocode_timeout_sec: 5
  matrix_timeout_sec: 10
  user_agent: "GoRouteOptimizerApp/1.0 (student project)"

output:
  duration_unit: minutes

# The preserved NYC DOT traffic experiment is intentionally not part of the
# active calculator configuration. See internal/deprecated/traffic/README.md.
